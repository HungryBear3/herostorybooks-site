  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"cefe7c68-e0bc-4dc6-b5b6-78811be9fc38\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"4c3336c3-0273-4c28-8705-7baa91bce089\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"cfc8e0c2-2438-445e-82d4-53559bfe93ce\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --paper:        #f4ebdb;\n    --paper-warm:   #ede1cb;\n    --cream:        #fbf5e8;\n    --board:        #e3d6bb;\n    --ink:          #1f1810;\n    --ink-2:        #3a2f22;\n    --ink-3:        #6b5d4a;\n    --ink-4:        #a39378;\n    --hair:         rgba(31,24,16,0.10);\n    --hair-soft:    rgba(31,24,16,0.06);\n\n    --rose:         #c08081;\n    --rose-deep:    #9c5e60;\n    --rose-soft:    #e9c9c8;\n    --rose-pale:    #f3dedd;\n    --forest:       #3d5240;\n    --ochre:        #b88a3e;\n    --ink-dark:     #1b150d;\n\n    --serif: \"Crimson Pro\", \"Source Serif 4\", Georgia, serif;\n    --sans:  \"Inter Tight\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", system-ui, sans-serif;\n    --mono:  \"JetBrains Mono\", ui-monospace, Menlo, monospace;\n  }\n\n  *, *::before, *::after { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    background: var(--board);\n    color: var(--ink);\n    font-family: var(--sans);\n    font-size: 15px;\n    line-height: 1.5;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n  body::before {\n    content: \"\"; position: fixed; inset: 0; pointer-events: none; z-index: 0;\n    background:\n      radial-gradient(circle at 12% 10%, rgba(31,24,16,0.06), transparent 50%),\n      radial-gradient(circle at 88% 88%, rgba(31,24,16,0.06), transparent 50%);\n  }\n  .board {\n    position: relative; z-index: 1;\n    max-width: 1880px; margin: 0 auto;\n    padding: 56px 56px 120px;\n  }\n\n  /* ---------- board header ---------- */\n  .board-head {\n    display: grid;\n    grid-template-columns: 1fr auto;\n    gap: 32px;\n    align-items: end;\n    padding-bottom: 28px;\n    border-bottom: 1px solid rgba(31,24,16,0.18);\n    margin-bottom: 40px;\n  }\n  .board-head .id {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    color: var(--ink-3);\n  }\n  .board-head h1 {\n    font-family: var(--serif);\n    font-weight: 500;\n    font-size: 44px;\n    line-height: 1.05;\n    letter-spacing: -0.02em;\n    margin: 8px 0 6px;\n  }\n  .board-head h1 em { font-style: italic; color: var(--rose-deep); }\n  .board-head .deck {\n    font-size: 15px;\n    color: var(--ink-2);\n    max-width: 760px;\n    margin: 0;\n  }\n  .board-head .meta {\n    font-family: var(--mono);\n    font-size: 10.5px;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--ink-3);\n    text-align: right;\n    line-height: 1.8;\n  }\n  .board-head .meta b { color: var(--ink); font-weight: 500; }\n\n  /* ---------- change notes strip ---------- */\n  .change-notes {\n    background: var(--cream);\n    border: 1px solid var(--hair);\n    border-radius: 10px;\n    padding: 22px 28px;\n    margin-bottom: 56px;\n    display: grid;\n    grid-template-columns: 220px 1fr;\n    gap: 28px;\n    align-items: start;\n  }\n  .change-notes .label {\n    font-family: var(--mono);\n    font-size: 10.5px;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    color: var(--ink-3);\n    line-height: 1.5;\n  }\n  .change-notes .label b {\n    display: block;\n    font-family: var(--serif);\n    font-weight: 500;\n    font-style: italic;\n    font-size: 22px;\n    color: var(--rose-deep);\n    text-transform: none;\n    letter-spacing: -0.012em;\n    margin-bottom: 6px;\n  }\n  .change-notes ul {\n    margin: 0; padding: 0; list-style: none;\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 6px 28px;\n    font-size: 13.5px;\n    color: var(--ink-2);\n    line-height: 1.5;\n  }\n  .change-notes ul li {\n    padding-left: 16px;\n    position: relative;\n  }\n  .change-notes ul li::before {\n    content: \"+\";\n    position: absolute; left: 0; top: 0;\n    font-family: var(--mono);\n    color: var(--rose-deep);\n    font-weight: 500;\n  }\n  .change-notes ul li b { color: var(--ink); font-weight: 500; }\n\n  /* ---------- frame chrome ---------- */\n  .frames {\n    display: grid;\n    grid-template-columns: minmax(0, 1fr) 440px;\n    gap: 40px;\n    align-items: start;\n  }\n  .frame-col > .label {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 0 6px 12px;\n    font-family: var(--mono);\n    font-size: 10.5px;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--ink-3);\n  }\n  .frame-col > .label .dim { color: var(--ink-4); }\n  .frame {\n    background: var(--cream);\n    border-radius: 14px;\n    overflow: hidden;\n    box-shadow:\n      0 1px 0 rgba(31,24,16,0.04),\n      0 30px 40px -24px rgba(31,24,16,0.32),\n      0 80px 100px -50px rgba(31,24,16,0.22);\n  }\n  .frame.mobile  { width: 440px; }\n\n  /* ---------- shared atoms ---------- */\n  .eyebrow {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--ink-3);\n  }\n  .eyebrow.rose { color: var(--rose-deep); }\n  .btn {\n    display: inline-flex; align-items: center; justify-content: center; gap: 10px;\n    border-radius: 999px;\n    font-family: var(--sans);\n    font-weight: 500;\n    cursor: default;\n    border: 1px solid transparent;\n    letter-spacing: -0.005em;\n    white-space: nowrap;\n  }\n  .btn-lg { height: 54px; padding: 0 28px; font-size: 15.5px; }\n  .btn-md { height: 44px; padding: 0 20px; font-size: 14px; }\n  .btn-sm { height: 36px; padding: 0 16px; font-size: 13px; }\n  .btn-ink   { background: var(--ink); color: var(--paper); }\n  .btn-rose  { background: var(--rose-deep); color: #fff5ec; }\n  .btn-bone  { background: #f3ead2; color: var(--ink-dark); }\n  .btn-ghost { background: transparent; color: var(--ink); border-color: rgba(31,24,16,0.22); }\n  .btn-ghost.on-dark { color: #f3ead2; border-color: rgba(243,234,210,0.32); }\n  .btn .arr {\n    width: 14px; height: 9px; position: relative; opacity: 0.95;\n  }\n  .btn .arr::after {\n    content: \"\"; position: absolute; left: 0; right: 4px; top: 50%;\n    height: 1.5px; background: currentColor; transform: translateY(-50%);\n  }\n  .btn .arr::before {\n    content: \"\"; position: absolute; right: 0; top: 50%;\n    width: 6px; height: 6px;\n    border-right: 1.5px solid currentColor;\n    border-top: 1.5px solid currentColor;\n    transform: translateY(-50%) rotate(45deg);\n  }\n  .wordmark {\n    font-family: var(--serif);\n    font-weight: 500;\n    font-size: 22px;\n    letter-spacing: -0.018em;\n    color: var(--ink);\n    display: inline-flex; align-items: baseline; gap: 6px;\n  }\n  .wordmark .dot {\n    width: 9px; height: 9px;\n    background: var(--rose);\n    border-radius: 50%;\n    display: inline-block;\n    transform: translateY(-2px);\n  }\n\n  /* ---------- price treatment (unified, serif italic) ---------- */\n  .price-num {\n    font-family: var(--serif);\n    font-weight: 500;\n    font-style: italic;\n    color: var(--ink);\n    letter-spacing: -0.024em;\n    line-height: 1;\n    font-feature-settings: \"lnum\" 1;\n  }\n  .price-num .currency {\n    font-size: 0.55em;\n    vertical-align: 0.55em;\n    margin-right: 1px;\n    font-style: italic;\n    opacity: 0.85;\n  }\n  .on-dark .price-num { color: #f3ead2; }\n\n  /* ---------- watercolor-style placeholder ---------- */\n  .photo {\n    position: relative;\n    overflow: hidden;\n    background: #f0e3cf;\n    display: block;\n    isolation: isolate;\n  }\n  .photo::before {\n    content: \"\";\n    position: absolute; inset: 0;\n    background:\n      url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.08 0'/><\u002Ffilter><rect width='100%' height='100%' filter='url(%23n)'/><\u002Fsvg>\"),\n      radial-gradient(ellipse 60% 50% at 30% 60%, rgba(192,128,129,0.45), transparent 70%),\n      radial-gradient(ellipse 40% 38% at 62% 56%, rgba(184,138,62,0.35), transparent 70%),\n      radial-gradient(ellipse 30% 24% at 50% 30%, rgba(107,91,140,0.18), transparent 70%);\n    mix-blend-mode: multiply;\n  }\n  .photo::after {\n    content: \"\";\n    position: absolute; inset: 0;\n    background: linear-gradient(180deg, rgba(244,235,219,0.0) 60%, rgba(31,24,16,0.18) 100%);\n  }\n  .photo .ph-meta {\n    position: absolute;\n    inset: auto auto 14px 14px;\n    font-family: var(--mono);\n    font-size: 10.5px;\n    letter-spacing: 0.08em;\n    color: var(--ink);\n    background: rgba(251,245,232,0.92);\n    border: 1px solid var(--hair);\n    padding: 5px 9px;\n    border-radius: 3px;\n    z-index: 3;\n  }\n  .photo .ph-center {\n    position: absolute; inset: 0;\n    display: flex; align-items: center; justify-content: center;\n    text-align: center;\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--ink-2);\n    z-index: 3;\n  }\n  .photo .ph-center span {\n    border: 1px dashed rgba(31,24,16,0.32);\n    padding: 9px 14px;\n    border-radius: 999px;\n    background: rgba(251,245,232,0.72);\n    max-width: 80%;\n    text-wrap: balance;\n  }\n\n  /* tone variants — different watercolor compositions */\n  .photo.tone-bedtime {\n    background: #f4e6cf;\n  }\n  .photo.tone-bedtime::before {\n    background:\n      url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.08 0'/><\u002Ffilter><rect width='100%' height='100%' filter='url(%23n)'/><\u002Fsvg>\"),\n      radial-gradient(ellipse 50% 60% at 32% 58%, rgba(107,91,140,0.4), transparent 70%),\n      radial-gradient(ellipse 28% 40% at 56% 60%, rgba(192,128,129,0.42), transparent 70%),\n      radial-gradient(ellipse 70% 30% at 50% 90%, rgba(184,138,62,0.25), transparent 70%);\n    mix-blend-mode: multiply;\n  }\n  .photo.tone-fishing {\n    background: #ecddc0;\n  }\n  .photo.tone-fishing::before {\n    background:\n      url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.08 0'/><\u002Ffilter><rect width='100%' height='100%' filter='url(%23n)'/><\u002Fsvg>\"),\n      radial-gradient(ellipse 80% 30% at 50% 90%, rgba(61,82,64,0.38), transparent 70%),\n      radial-gradient(ellipse 28% 35% at 40% 50%, rgba(28,32,40,0.4), transparent 70%),\n      radial-gradient(ellipse 22% 28% at 58% 52%, rgba(28,32,40,0.32), transparent 70%),\n      radial-gradient(ellipse 100% 40% at 50% 25%, rgba(192,128,129,0.18), transparent 70%);\n    mix-blend-mode: multiply;\n  }\n  .photo.tone-couch {\n    background: #f1e2c8;\n  }\n  .photo.tone-couch::before {\n    background:\n      url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.08 0'/><\u002Ffilter><rect width='100%' height='100%' filter='url(%23n)'/><\u002Fsvg>\"),\n      radial-gradient(ellipse 70% 45% at 50% 75%, rgba(184,138,62,0.42), transparent 70%),\n      radial-gradient(ellipse 24% 30% at 42% 48%, rgba(28,32,40,0.42), transparent 70%),\n      radial-gradient(ellipse 18% 22% at 58% 52%, rgba(28,32,40,0.32), transparent 70%),\n      radial-gradient(ellipse 28% 18% at 50% 60%, rgba(251,245,232,0.6), transparent 70%);\n    mix-blend-mode: multiply;\n  }\n  .photo.tone-cover {\n    background: #f0d9c5;\n  }\n  .photo.tone-cover::before {\n    background:\n      url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.08 0'/><\u002Ffilter><rect width='100%' height='100%' filter='url(%23n)'/><\u002Fsvg>\"),\n      radial-gradient(ellipse 55% 60% at 50% 55%, rgba(156,94,96,0.42), transparent 70%),\n      radial-gradient(ellipse 70% 20% at 50% 85%, rgba(184,138,62,0.3), transparent 70%);\n    mix-blend-mode: multiply;\n  }\n  .photo.tone-giving {\n    background: #f3e3c8;\n  }\n  .photo.tone-giving::before {\n    background:\n      url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.08 0'/><\u002Ffilter><rect width='100%' height='100%' filter='url(%23n)'/><\u002Fsvg>\"),\n      radial-gradient(ellipse 60% 60% at 45% 50%, rgba(184,138,62,0.38), transparent 70%),\n      radial-gradient(ellipse 18% 28% at 38% 50%, rgba(28,32,40,0.45), transparent 70%),\n      radial-gradient(ellipse 14% 22% at 56% 58%, rgba(28,32,40,0.32), transparent 70%),\n      radial-gradient(ellipse 22% 12% at 47% 60%, rgba(251,245,232,0.55), transparent 70%);\n    mix-blend-mode: multiply;\n  }\n\n  /* ====================================================================== */\n  /*  LANDING — desktop                                                     */\n  /* ====================================================================== */\n  .lp {\n    background: var(--paper);\n    color: var(--ink);\n    font-family: var(--sans);\n    position: relative;\n    overflow: hidden;\n  }\n  .lp::before {\n    content: \"\"; position: absolute; inset: 0; pointer-events: none;\n    background:\n      url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.07  0 0 0 0.04 0'/><\u002Ffilter><rect width='100%' height='100%' filter='url(%23n)'/><\u002Fsvg>\");\n    z-index: 0;\n  }\n  .lp > * { position: relative; z-index: 1; }\n\n  /* announcement bar */\n  .lp .annc {\n    background: var(--ink-dark);\n    color: #f3ead2;\n    text-align: center;\n    padding: 9px 16px;\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n  }\n  .lp .annc .rose-dot {\n    display: inline-block;\n    width: 6px; height: 6px; border-radius: 50%;\n    background: var(--rose); margin-right: 10px; vertical-align: middle;\n  }\n\n  /* nav */\n  .lp .nav {\n    dis otos<\u002Fb> · watercolor placeholders, art TBD<\u002Fdiv>\n      <div><b>Frames<\u002Fb> · desktop 1440 · mobile 390<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ---------- change notes ---------- -->\n  <section class=\"change-notes\">\n    <div class=\"label\">\n      <b>What changed<\u002Fb>\n      v01 → v02\n    <\u002Fdiv>\n    <ul>\n      <li><b>Price anchor<\u002Fb> tightened — $14.99 + \"includes printable gift card\", consistent serif italic.<\u002Fli>\n      <li><b>Stronger eyebrow<\u002Fb> — \"Arrives by inbox, not mail\".<\u002Fli>\n      <li><b>Delivery reassurance<\u002Fb> — explicit PDF + private link + any-device line.<\u002Fli>\n      <li><b>Varied CTA copy<\u002Fb> across the page (hero · mid · post-proof · final).<\u002Fli>\n      <li><b>Watercolor-style photo slots<\u002Fb> — labeled, no more striped fabric look.<\u002Fli>\n      <li><b>4-step grid<\u002Fb> uses auto-fit / min 240px — no narrow-column collapse.<\u002Fli>\n      <li><b>AI disclosure<\u002Fb> attached to step ii.<\u002Fli>\n      <li><b>Dedication mechanic<\u002Fb> surfaced in step i + on the gift card.<\u002Fli>\n      <li><b>Father's Day testimonial<\u002Fb> (single, marked placeholder).<\u002Fli>\n      <li><b>Visual gift card<\u002Fb> with QR, redeem code, from-the-kids dedication.<\u002Fli>\n      <li><b>Meet the editors<\u002Fb> surface with first-name roster.<\u002Fli>\n      <li><b>Giving moment<\u002Fb> — quiet emotional section before FAQ.<\u002Fli>\n      <li><b>Refund/proof confidence<\u002Fb> visible at final CTA.<\u002Fli>\n      <li><b>Concrete final CTA<\u002Fb> — Order tonight · Review the proof · Hand him the card on Sunday.<\u002Fli>\n      <li><b>FAQ expanded<\u002Fb> with the six buyer-objection questions.<\u002Fli>\n      <li><b>Mobile sticky CTA<\u002Fb> — primary \"Start his book · $14.99\" + secondary \"See sample\".<\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <div class=\"frames\">\n\n    <!-- =================== DESKTOP ================ indow.<\u002Fp>\n\n              <div class=\"cta-row\">\n                <span class=\"btn btn-lg btn-rose\">Start his book <span class=\"arr\"><\u002Fspan><\u002Fspan>\n                <span class=\"btn btn-lg btn-ghost\">See a sample first<\u002Fspan>\n              <\u002Fdiv>\n\n              <div class=\"price-line\">\n                <span class=\"price-num\"><span class=\"currency\">$<\u002Fspan>19<\u002Fspan>\n                <div class=\"price-meta\">\n                  <span class=\"lbl\">Father's Day digital edition<\u002Fspan>\n                  <span class=\"val\">Includes printable gift card<\u002Fspan>\n                <\u002Fdiv>\n                <span class=\"reassure\">No shipping. No carrier risk. Print upgrades available after you approve the proof.<\u002Fspan>\n              <\u002Fdiv>\n\n              <div class=\"reassure-row\">\n                <span class=\"item\"><span class=\"mark\">✓<\u002Fspan> You approve every spread<\u002Fspan>\n                <span class=\"item\"><span class=\"mark\">✓<\u002Fspan> A human editor reads it<\u002Fspan>\n                <span class=\"item\"><span class=\"mark\">✓<\u002Fspan> Gift card included<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"stage\">\n              <div class=\"photo tone-couch\">\n                <div class=\"ph-meta\">image — Dad + child on couch with tablet, soft window light<\u002Fdiv>\n                <div class=\"ph-center\"><span>Final illustration / photography TBD<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"pinned tl\">\n                <span class=\"lbl\">The digital edition<\u002Fspan>\n                <span class=\"val\">Delivered as a <em>PDF<\u002Fem>, not a package<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"pinned ml\">\n                <span class=\"lbl\">Before delivery<\u002Fspan>\n                <span class=\"val\">Editor checks every page — names, pronouns, likenes "badge\"><span class=\"dot\"><\u002Fspan>You · ~ 5 min<\u002Fspan>\n                <h4>Tell us about <em>him<\u002Fem>.<\u002Fh4>\n                <p>The kids' names and ages, one photo of dad with each child, a few details you want in the story (the dog, the truck, the inside joke).<\u002Fp>\n                <div class=\"dedication\">\n                  <div class=\"row\">\n                    <span class=\"lbl\">Add a dedication from the kids<\u002Fspan>\n                    <span class=\"free\">Free<\u002Fspan>\n                  <\u002Fdiv>\n                  <span class=\"quote\">\"From: Lila &amp; Marcus, with love.\"<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div class=\"step\">\n                <span class=\"num\">ii<\u002Fspan>\n                <span class=\"badge us\"><span class=\"dot\"><\u002Fspan>Us · within 48h<\u002Fspan>\n                <h4>We write &amp; illustrate <em>24 pages<\u002Fem>.<\u002Fh4>\n                <p>Our writers and illustrators build the story around your photo. Likeness-matched art that actually looks like the people in it.<\u002Fp>\n                <div class=\"ai-note\">\n                  <span class=\"ico\" aria-hidden=\"true\">\n                    <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"8\" cy=\"8\" r=\"6.5\"><\u002Fcircle><path d=\"M8 4.5v4\"><\u002Fpath><circle cx=\"8\" cy=\"11\" r=\"0.6\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>\n                  <\u002Fspan>\n                  <span><b>AI-assisted illustration<\u002Fb>, matched to your photo, then reviewed by a human editor before delivery. Never a raw model output.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div class=\"step\">\n                <span class=\"num\">iii<\u002Fspan>\n                <span class=\"badge\"><span class=\"dot\"><\u002Fspan>You · take your time<\u002Fspan>\n                <h4>Review the <em>full proof<\u002Fem>.<\u002Fh4>\n                <p>Open every spread in a private review room. Drop a pin on anything that's off — name, eye color, page order. You sign off, not us.<\u002Fp>\n              <\u002Fdiv>\n\n              <div class=\"step\">\n                <span class=\"num\">iv<\u002Fspan>\n                <span class=\"badge us\"><span class=\"dot\"><\u002Fspan>Us · same day<\u002Fspan>\n                <h4>Editor reads it, <em>then<\u002Fem> we send the PDF.<\u002Fh4>\n                <p>A real human reads the final file end to end. Then we email you the finished book and the printable gift card to hand to dad.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- mid-page CTA bar -->\n            <div class=\"mid-cta\">\n              <span class=\"copy\">Curious what a finished spread looks like? <em>Take a peek<\u002Fem> before you start.<\u002Fspan>\n              <span class=\"btn btn-md btn-ghost\">See a sample first <span class=\"arr\"><\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <!-- SAMPLE PROOF -->\n          <section class=\"section cream\">\n            <div class=\"sec-head\">\n              <div>\n                <div class=\"eyebrow rose\">Sample proof — peek inside<\u002Fdiv>\n                <h2>This is what you'll <em>actually see<\u002Fem> before we send it.<\u002Fh2>\n              <\u002Fdiv>\n              <p class=\"deck\">Every order opens a private review room. You can drop pins anywhere on a spread, leave a note, and approve or send back. <b>Nothing leaves our system until you and an editor sign off.<\u002Fb><\u002Fp>\n            <\u002Fdiv>\n\n            <div class=\"proof-wrap\">\n              <div class=\"proof-stage\">\n                <div class=\"photo tone-fishing\">\n                  <div class=\"ph-meta\">spread illustration — Dad &amp; kid fishing at dock, golden hour<\u002Fdiv>\n                  <div class=\"ph-center\   <\u002Fdiv>\n\n            <!-- post-proof CTA -->\n            <div class=\"post-proof-cta\">\n              <span class=\"btn btn-lg btn-rose\">Make his book <span class=\"arr\"><\u002Fspan><\u002Fspan>\n              <span class=\"btn btn-lg btn-ghost\">See a sample first<\u002Fspan>\n              <span class=\"micro\">Reviewed by you. Then by us. Then delivered.<\u002Fspan>\n            <\u002Fdiv>\n\n            <!-- meet the editors -->\n            <div class=\"editors\">\n              <div class=\"copy\">\n                <div class=\"eyebrow rose\">The humans behind the proof<\u002Fdiv>\n                <h3>A real person reads <em>every book<\u002Fem> before it leaves us.<\u002Fh3>\n                <p>Our five-person editorial team checks names, pronouns, likeness, page order, and that quiet thing that makes the story actually <b>about<\u002Fb> the family — not just <em>have<\u002Fem> them in it.<\u002Fp>\n                <span class=\"link\">Meet the editors →<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"roster\" aria-label=\"Editor portraits (placeholder)\">\n                <span class=\"face\">S<\u002Fspan>\n                <span class=\"face b\">N<\u002Fspan>\n                <span class=\"face c\">A<\u002Fspan>\n                <span class=\"face d\">J<\u002Fspan>\n                <span class=\"face e\">R<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <!-- TESTIMONIAL -->\n          <section class=\"testimonial\">\n            <span class=\"quote-mark\">\"<\u002Fspan>\n            <blockquote>I cried in the kitchen. My daughter handed me the card and I opened the story on my phone — <em>that's a moment I won't forget.<\u002Fem><\u002Fblockquote>\n            <div class=\"attrib\">\n              <span><b>James, dad of one<\u002Fb> · Last Father's Day<\u002Fspan>\n              <span class=\"pill\">Placeholder · final testimonial TBD<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <!-- GIFT-CARD section -->\n          <section class=\"gift-band\">\n            <div class=\"copy\">\n              <div class=\"eyebrow rose\">A book to read, a card to hand him<\u002Fdiv>\n              <h3>Print at home. <em>Slip it into an envelope.<\u002Fem><\u002Fh3>\n              <p>Every order includes a printable gift card with a private redeem link and your dedication from the kids. He scans the QR, the story opens on his phone, and the rest is the part you'll remember.<\u002Fp>\n              <ul>\n                <li><span class=\"mark\">✓<\u002Fspan> Personalised dedication line from the kids<\u002Fli>\n                <li><span class=\"mark\">✓<\u002Fspan> Private QR / redeem link unique to your order<\u002Fli>\n                <li><span class=\"mark\">✓<\u002Fspan> Prints clean on standard letter / A4 paper<\u002Fli>\n                <li><span class=\"mark\">✓<\u002Fspan> Included free with the $14.99 digital edition<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n\n            <!-- Visual gift card mock -->\n            <div class=\"giftcard\" aria-label=\"Gift card preview\">\n              <div class=\"body\">\n                <div class=\"top\">\n                  <span class=\"brand\"><span class=\"dot\"><\u002Fspan>HeroStoryBooks<\u002Fspan>\n                  <span>Father's Day · 2026<\u002Fspan>\n                <\u002Fdiv>\n                <div>\n                  <div class=\"headline\">\"There's a book waiting for you, Dad — <em>you're in it.<\u002Fem>\"<\u002Fdiv>\n                  <div class=\"ded\">From: <b>Lila &amp; Marcus<\u002Fb>, with love.<\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"bottom\">\n                  <div class=\"meta\">\n                    Redeem at<br><b>herostorybooks.com/r<\u002Fb>\n                    <div class=\"code\">M7-LILA-2026<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"qr\">\n                <div class=\"qr-art\" aria-hidden=\"true\"><\u002Fdiv>\n                <span class=\"lbl\">Scan to open<br>his book<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <!-- GIVING MOMENT (quiet emotional) -->\n          <section class=\"giving\">\n            <div class=\"photo-wrap\">\n              <div class=\"photo tone-giving\">\n                <div class=\"ph-meta\">image — Dad on couch holding tablet, kid leaning over his shoulder, both reading<\u002Fdiv>\n                <div class=\"ph-center\"><span>The moment · art / photography TBD<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"copy\">\n              <div class=\"eyebrow rose\">The moment<\u002Fdiv>\n              <h3>What the gift actually <em>looks like<\u002Fem>.<\u002Fh3>\n              <p>It's not the unboxing — there's no box. It's him on the couch on Sunday morning, the kid leaning over his shoulder, and a quiet \"wait, is that <em>me<\u002Fem>?\" on page two.<\u002Fp>\n              <p>You order tonight. He reads it on Sunday. The book stays on his phone forever.<\u002Fp>\n              <div class=\"small\">Step <b>v<\u002Fb> — the part we can't ship. But we tried to design for it.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <!-- FAQ -->\n          <section class=\"section\">\n            <div class=\"faq-grid\">\n              <div>\n                <div class=\"eyebrow rose\">Questions, answered<\u002Fdiv>\n                <h2>Honest answers to the <em>real<\u002Fem> questions.<\u002Fh2>\n                <p class=\"aside\">If yours isn't here, write to us — <a href=\"#\">hello@herostorybooks.com<\u002Fa> — a human reads every email, usually within the same day.<\u002Fp>\n              <\u002Fdiv>\n              <div class=\"faq-list\">\n                <div class=\"faq open\">\n                  <span class=\"n\">01<\u002Fspan>\n                  <div>\n                    <h4>What if I order today — when will I get the PDF?<\u002Fh4>\n                    <p>The digital edition takes the carrier out of the equation, but it isn't instant — we still write, illustrate, and review every book by hand. We'll show you a delivery window before you pay, based on the current queue, and we only quote windows that comfortably clear Father's Day for orders placed through this page.<\u002Fp>\n                  <\u002Fdiv>\n                  <span class=\"toggle\">−<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"faq\">\n                  <span class=\"n\">02<\u002Fspan>\n                  <div>\n                    <h4>Can I send it from my kids if they're too young to write?<\u002Fh4>\n                    <p>Absolutely — and that's what most people do. The \"from\" line is yours to write on their behalf (\"from Lila &amp; Marcus, with love\"). The dedication is free, and you can change it any time before the proof goes out.<\u002Fp>\n                  <\u002Fdiv>\n                  <span class=\"toggle\">+<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"faq\">\n                  <span class=\"n\">03<\u002Fspan>\n                  <div>\n                    <h4>Does it work if I only have phone photos of Dad?<\u002Fh4>\n                    <p>Yes. One front-facing phone photo with decent light is plenty for the illustrator. If you have more — selfies, a wedding shot, last summer — feel free to upload them; extra reference helps but isn't required.<\u002Fp>\n                  <\u002Fdiv>\n                  <span class=\"toggle\">+<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"faq\">\n                  <span class=\"n\">04<\u002Fspan>\n                  <div>\n                    <h4>Can Dad print it himself if he wants a physical copy?<\u002Fh4>\n                    <p>Yes — the PDF is print-ready at home-printer resolution. If he wants a properly bound copy, you (or he) can upgrade to a softcover ($39.99) or hardcover ($64.99) any time after the proof is approved, and we'll ship the same book.<\u002Fp>\n                  <\u002Fdiv>\n                  <span class=\"toggle\">+<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"faq\">\n                  <span class=\"n\">05<\u002Fspan>\n                  <div>\n                    <h4>What happens if I want changes?<\u002Fh4>\n                    <p>That's exactly what the proof is for. You can request revisions for free — likeness, names, story details — until the book is right. An editor reads it after you do as a final check.<\u002Fp>\n                  <\u002Fdiv>\n                  <span class=\"toggle\">+<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"faq\">\n                  <span class=\"n\">06<\u002Fspan>\n                  <div>\n                    <h4>Is the art AI-assisted?<\u002Fh4>\n                    <p>Yes, and we want to be plain about it. We use AI tools as part of the illustration process to match your photo, but every spread is finished and reviewed by a human illustrator and editor before it reaches you. We're not handing you a raw model output and calling it a keepsake.<\u002Fp>\n                  <\u002Fdiv>\n                  <span class=\"toggle\">+<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <!-- FINAL CTA SECTION -->\n          <section class=\"cta-section\">\n            <div class=\"row\">\n              <div>\n                <div class=\"eyebrow\">Arrives by inbox, not mail<\u002Fdiv>\n                <h2>Order tonight. Review the proof. <em>Hand him the gift card on Sunday.<\u002Fem><\u002Fh2>\n                <p class=\"lede\">No carriers between you and Father's Day. Three quiet steps, on your time, before the weekend.<\u002Fp>\n\n                <div class=\"t
