name: CI

# Reproduces the merge gates used to verify pull requests locally:
#   1. npm test          — Node test suite
#   2. npm run test:e2e  — Playwright Chromium suite
#   3. npx next build    — production build + TypeScript gate
#
# NOTE: reporting these checks does NOT enforce them. `main` currently has no
# branch protection, so a red run does not block a merge. To make these gates
# real, register these two check names as REQUIRED on `main`:
#     npm test + next build
#     npm run test:e2e (Chromium)
# (GitHub registers the job `name:` strings, not the job keys.)
#
# BOTH jobs are expected RED on `main` as of b94a97d, for two separate reasons:
#   - `npm test` has 14 pre-existing failures (order-cache state leaking between
#     tests via the module-level map in src/lib/orders.ts), which PR #138 fixes.
#   - the e2e job's guard step fails until #138 introduces the Playwright suite
#     (the job runs; it cannot pass).
# Do NOT register either check as REQUIRED until #138 has landed, or `main`
# becomes un-mergeable.
#
# `pull_request` (never `pull_request_target`): a fork's PR runs its own code
# with a read-only token and NO access to repository secrets.
# `pull_request_target` would run untrusted code with a privileged token and
# secrets, which is exactly what must not happen here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only. Nothing here writes to the repo, publishes, comments, or deploys.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede stale PR runs. On push to main this is false, which protects an
  # IN-PROGRESS run; GitHub still cancels queued-but-not-started runs in the
  # group, so a rapid burst of merges can still lose an intermediate verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ── Credential blanking (defence in depth) ────────────────────────────────
  #
  # The load-bearing guarantee is structural, not this list: this workflow
  # references no `secrets.*`, declares no `environment:`, and runs on
  # GitHub-hosted runners, so no repository or environment secret is available
  # to it at all — including on fork PRs.
  #
  # These are blanked anyway so that a future `environment:` addition, a
  # self-hosted runner, or a leaked value cannot reach a live service. The list
  # covers the credential-bearing variables the application reads, including
  # ones reached dynamically via `process.env[name]` (e.g. STRIPE_WEBHOOK_SECRET
  # through src/lib/stripe-env.ts), so it is not a plain grep of literal reads.
  #
  # Each name below was checked individually to be fail-closed on an empty
  # value. Two credential-bearing variables are deliberately NOT in this list,
  # because each falls back to a hardcoded default, so blanking would SELECT a
  # known value rather than close anything — and leaving them unset behaves
  # identically without implying a guarantee that is not there:
  #   FAMILY_REVIEW_ADMIN_KEY -> || 'reviewer-preview'
  #                              (src/lib/family-review/admin-auth.ts)
  #   FAMILY_REVIEW_CODES     -> falls through to DEFAULT_INVITE_CODES
  #                              (src/app/api/family-review/upload/route.ts)
  # NEXT_PUBLIC_FAMILY_REVIEW_CODES feeds that same invite-code check and is
  # likewise absent; it is not treated as a credential because Next inlines
  # NEXT_PUBLIC_* into the client bundle by construction.
  BLOB_READ_WRITE_TOKEN: ''
  CRON_SECRET: ''
  FAL_KEY: ''
  GOOGLE_GEMINI_API_KEY: ''
  HSB_ORDER_ADMIN_KEY: ''
  # Read FIRST, before RESEND_API_KEY (src/lib/order-email.ts) — blanking only
  # the fallback would have left the primary live.
  HSB_RESEND_API_KEY: ''
  LULU_CLIENT_KEY: ''
  LULU_CLIENT_SECRET: ''
  LULU_WEBHOOK_SECRET: ''
  OPENAI_API_KEY: ''
  RESEND_API_KEY: ''
  STRIPE_SECRET_KEY: ''
  STRIPE_WEBHOOK_SECRET: ''

  # ── Environment shaping (not credentials) ─────────────────────────────────
  # These do different things; empty string is falsy for both.
  #   VERCEL=''     keeps src/lib/orders.ts off BOTH its Vercel behaviours —
  #                 the '/tmp/hsb/orders' store location (:1110) and the
  #                 automatic durable-persistence enable (:1095). Each gates on
  #                 process.env.VERCEL alone.
  #   VERCEL_ENV='' contributes to neither of those. It only avoids the
  #                 'preview' branch of getBlobNamespace() that throws
  #                 BlobNamespaceError.
  VERCEL: ''
  VERCEL_ENV: ''
  # getBlobAccessMode() defaults to 'public'; '' would fall through to that
  # default and change nothing, so 'private' is used to actually force the
  # unauthenticated public-CDN read path off.
  # This is a DELIBERATE divergence from production, which runs 'public' by
  # design (the prod token rejects private writes). With BLOB_READ_WRITE_TOKEN
  # blank no blob path is reachable either way, so it changes no result — it is
  # defence in depth, not fidelity.
  HSB_BLOB_ACCESS_MODE: 'private'
  NEXT_TELEMETRY_DISABLED: '1'
  #
  # HSB_REQUIRE_DURABLE_PERSISTENCE is deliberately NOT set at workflow level.
  # The unit tests set and delete it themselves, and playwright.config.ts sets
  # it for the server it starts. Setting it here would also apply to
  # `npx next build`, making the build gate LESS production-like than the real
  # Vercel build it is meant to approximate.

jobs:
  # ── Gates 1 + 3: Node suite and production build ─────────────────────────
  unit-and-build:
    name: npm test + next build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Do not leave the job token in .git/config where a malicious
          # postinstall script could read it.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Pinned to the version the gates were verified on. The repo declares
          # no engines/.nvmrc, and `node --experimental-strip-types` in the
          # `test` script needs a modern Node, so this is explicit not floated.
          node-version: '24.18.0'
          # Caches ~/.npm only, keyed on package-lock.json. Never node_modules,
          # .next, or any generated order store. GitHub scopes caches by ref,
          # so a fork PR cannot write a cache that a later main run reads.
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Node test suite
        run: npm test
        env:
          # Synthetic, throwaway. The tests override and delete this themselves;
          # it is set so that nothing can fall back to the workspace .data/orders.
          HSB_ORDER_STORE_DIR: ${{ runner.temp }}/hsb-order-store-unit

      - name: Production build + TypeScript gate
        run: npx next build
        env:
          HSB_ORDER_STORE_DIR: ${{ runner.temp }}/hsb-order-store-build

  # ── Gate 2: Playwright Chromium suite ────────────────────────────────────
  # Separate job so a browser failure is distinguishable at a glance from a
  # unit or build failure, and so the two run in parallel.
  e2e:
    name: npm run test:e2e (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify the e2e suite is present
        # Fails loudly rather than skipping. A silently-skipped browser gate is
        # worse than a red one: it would let a PR deleting the suite pass.
        run: |
          missing=0
          [ -f playwright.config.ts ] || { echo "::error::playwright.config.ts is missing"; missing=1; }
          node -e "process.exit(require('./package.json').scripts['test:e2e'] ? 0 : 1)" \
            || { echo "::error::package.json has no test:e2e script"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::The Playwright suite is not present on this branch. It is introduced by PR #138; this gate cannot pass until that lands."
            exit 1
          fi

      - name: Install Chromium + Linux deps
        # Only Chromium. The version comes from the @playwright/test pinned in
        # package-lock.json, so browser and client cannot drift. Ordered AFTER
        # the guard so it can never fetch Playwright on a branch without it.
        run: npx playwright install --with-deps chromium

      # KNOWN LIMITATION, not mitigated here. playwright.config.ts starts its
      # own `next build && next start` under a 120s webServer readiness budget
      # that this workflow cannot override (the config lives in PR #138). A cold
      # production build measured ~35s locally and will be slower on a 4-vCPU
      # runner, so a false red is possible on a loaded runner. Pre-building here
      # was tried and removed: Next 16's Turbopack production build persists no
      # compilation cache (a second build measured 31s vs 35s, and .next/cache
      # holds only 412K of metadata), so it bought nothing and cost a full extra
      # build. The real fix is to make that timeout env-overridable in
      # playwright.config.ts; see the PR description.
      - name: Playwright suite
        # playwright.config.ts builds and starts the app itself and points
        # HSB_ORDER_STORE_DIR at a throwaway .e2e-store/ in the workspace.
        #
        # It ADDRESSES the server at 127.0.0.1 (baseURL and the readiness url)
        # but does NOT bind it there: the command is `next start -p PORT` with
        # no -H, and Next defaults to 0.0.0.0. Verified by measurement — the
        # listening socket is `TCP *:PORT`, and HOSTNAME=127.0.0.1 does not
        # change it. On a GitHub-hosted runner the VM is ephemeral and inbound
        # traffic is firewalled, so the practical exposure is nil, but this is
        # NOT loopback-bound and should not be described as such. The fix is
        # `-H 127.0.0.1` in playwright.config.ts, which lives in PR #138 and is
        # out of scope here; tracked as a follow-up. It also blanks a credential list of its own, but
        # that list is narrower than this workflow's and misses several names
        # the app reads; the workflow-level env block above is what actually
        # closes the gap, because webServer launches with
        # {...defaults, ...process.env, ...webServer.env}.
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.run_id }}
          # Reports and traces only. The generated order store (.e2e-store/) is
          # deliberately NOT uploaded. This repo is public, so artifacts are
          # world-readable: everything here is synthetic (example.invalid hosts,
          # tokens minted for ephemeral synthetic orders in a throwaway store).
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
